name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-4f7c8d9e2a1b6c3d5e0f
      DJANGO_DEBUG: "false"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check demo/miprimerproyecto
      - run: python -m pytest
      - run: python demo/miprimerproyecto/manage.py makemigrations --check --dry-run
      - run: python demo/miprimerproyecto/manage.py check --deploy
      - run: python -m pip check
      - run: python -m pip_audit -r demo/miprimerproyecto/requirements.txt
